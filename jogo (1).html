<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Defesa do Reino — Crônicas do Arpão</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#1b1209;display:flex;justify-content:center;align-items:center;font-family:Georgia,'Palatino Linotype',serif;color:#f1deae;padding:10px}
#game{width:908px;max-width:100%;position:relative;border:4px solid #7a5a1e;box-shadow:0 0 0 3px #3b2610,0 12px 40px #000;user-select:none}
canvas{display:block;width:900px;height:600px;max-width:100%;cursor:crosshair}
.bar{display:flex;gap:6px;align-items:center;padding:7px 10px;background:linear-gradient(#5a3a1a,#3b2610);flex-wrap:wrap}
.stat{padding:3px 10px;background:#2a1a0a;border:2px solid #b8892b;border-radius:3px;font-weight:bold;font-size:14px}
.ttl{margin-left:auto;color:#e8b53a;font-style:italic;letter-spacing:1px}
.b{font:bold 13px Georgia,serif;color:#f1deae;background:#6b4423;border:2px solid #b8892b;border-radius:3px;padding:6px 10px;cursor:pointer;transition:all .15s}
.b:hover:not(:disabled){background:#85572b;transform:translateY(-1px)}.b:disabled{opacity:.45;cursor:default}
.b.on{background:#9a2f1c;border-color:#ffd56a;box-shadow:0 0 12px rgba(255,213,106,.4)}.b.no{opacity:.6}
.b.harp{background:#1c4a6b;border-color:#5fa3c0}
.b.harp:hover:not(:disabled){background:#256a94}
.b.ice{background:#2a5a7a;border-color:#7ec8e3}
.b.ice:hover:not(:disabled){background:#3a7a9a}
.b.thunder{background:#5a4a1a;border-color:#e8d040}
.b.thunder:hover:not(:disabled){background:#7a6a2a}
.b.fire{background:#7a2a1a;border-color:#e86a20}
.b.fire:hover:not(:disabled){background:#9a3a2a}
.b.dark{background:#3a1a4a;border-color:#a060d0}
.b.dark:hover:not(:disabled){background:#5a2a6a}
.go{background:#2f6b2f;margin-left:auto}.go:hover:not(:disabled){background:#3d8a3d}
#tip{font-size:12px;color:#d9c08a;font-style:italic;min-height:16px}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:30px;text-align:center;background:rgba(20,10,2,.92);overflow-y:auto}
#ov.win{background:rgba(20,10,2,.4)}#ov.hide{display:none}
#ov h1{font-size:44px;margin:0;color:#e8b53a;letter-spacing:2px;text-shadow:0 3px 0 #5a1e10,0 0 24px rgba(232,181,58,.5)}
#ov p{max-width:680px;line-height:1.5;margin:0;font-size:15px}
#ov .b{font-size:18px;padding:10px 30px;background:#9a2f1c}
#ov .towersInfo{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:720px;width:100%;margin:6px 0}
#ov .towerCard{background:rgba(40,20,8,.7);border:1px solid #7a5a1e;border-radius:5px;padding:8px 10px;text-align:left;font-size:12px;line-height:1.4}
#ov .towerCard b{color:#ffd56a;font-size:13px;display:block;margin-bottom:2px}
#ov .towerCard .cost{color:#e8b53a;font-size:11px}
#ov .howto{background:rgba(28,74,107,.4);border:1px solid #5fa3c0;border-radius:5px;padding:10px 14px;max-width:720px;font-size:13px;line-height:1.5;text-align:left}
#ov .howto b{color:#7ec8e3}

/* ---------- TELA INICIAL ANIMADA ---------- */
#ov.intro{background:#12081c;padding:26px 16px 22px;justify-content:space-between;gap:0;overflow:hidden}
#introCv{position:absolute;inset:0;width:100%;height:100%;max-width:none;cursor:default;z-index:0}
.introTop,.introBottom{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center}
.introTop{gap:6px;animation:titleFloat 4s ease-in-out infinite}
#ov.intro h1{font-size:58px;letter-spacing:3px;line-height:1.05;
 background:linear-gradient(100deg,#c98a1e 0%,#ffe9a0 35%,#ffd56a 50%,#ffe9a0 65%,#c98a1e 100%);background-size:250% 100%;
 -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;text-shadow:none;
 filter:drop-shadow(0 4px 0 #5a1e10) drop-shadow(0 0 22px rgba(232,181,58,.55));animation:shine 5s linear infinite}
.introTag{font-size:18px;color:#ffe3a3;font-style:italic;letter-spacing:2px;text-shadow:0 2px 6px #000,0 0 14px rgba(0,0,0,.8)}
.chips{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;justify-content:center}
.chips span{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:25px;
 background:radial-gradient(circle at 35% 30%,rgba(90,58,26,.95),rgba(30,16,6,.95));border:2px solid #b8892b;box-shadow:0 4px 10px rgba(0,0,0,.6);
 animation:chipFloat 2.6s ease-in-out infinite;animation-delay:var(--d,0s)}
.chips span.hp{border-color:#7ec8e3;box-shadow:0 0 14px rgba(126,200,227,.6),0 4px 10px rgba(0,0,0,.6)}
#ov .b.playBtn{font-size:26px;letter-spacing:3px;padding:14px 62px;border-radius:8px;border:3px solid #ffd56a;color:#fff6d8;
 background:linear-gradient(#d84a2a,#8a1f10);text-shadow:0 2px 0 #4a0f06;animation:playPulse 1.8s ease-in-out infinite}
#ov .b.playBtn:hover:not(:disabled){background:linear-gradient(#ee5a36,#a02a18);transform:scale(1.07)}
.helpBtn{margin-top:12px;font:italic 13px Georgia,serif;color:#e6cf99;background:rgba(20,8,0,.55);border:1px solid #7a5a1e;border-radius:14px;padding:4px 14px;cursor:pointer;transition:all .15s}
.helpBtn:hover{color:#ffd56a;background:rgba(122,90,30,.5)}
.introHelp{display:none;position:absolute;z-index:5;left:50%;top:50%;transform:translate(-50%,-50%);width:min(440px,90%);
 background:rgba(14,6,0,.96)!important;border:2px solid #b8892b!important;box-shadow:0 8px 30px #000;cursor:pointer}
.introHelp.show{display:block;animation:pop .25s ease-out}
.introHelp div{margin:5px 0;font-size:14px}
.introHelp small{display:block;text-align:center;color:#a89060;margin-top:8px;font-size:11px}
@keyframes shine{from{background-position:250% 0}to{background-position:-250% 0}}
@keyframes titleFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes chipFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes playPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,213,106,.55),0 6px 18px rgba(0,0,0,.7)}50%{box-shadow:0 0 0 14px rgba(255,213,106,0),0 6px 18px rgba(0,0,0,.7)}}
@keyframes pop{from{opacity:0;transform:translate(-50%,-46%) scale(.94)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@media(max-width:620px){#ov.intro h1{font-size:34px}.introTag{font-size:13px}.chips span{width:38px;height:38px;font-size:19px}#ov .b.playBtn{font-size:20px;padding:11px 40px}}

#storyBox,#tutorial{position:absolute;left:50%;transform:translateX(-50%);width:82%;background:rgba(20,8,0,.96);border:2px solid #b8892b;border-radius:6px;padding:14px 18px;font-size:14px;line-height:1.5;color:#f1deae;box-shadow:0 6px 24px rgba(0,0,0,.7);display:none;z-index:5;text-align:center;padding-right:34px}
#storyBox.show,#tutorial.show{display:block}
#storyBox{top:130px}
#tutorial{top:130px;background:rgba(28,74,107,.97);border-color:#5fa3c0;color:#e8f4fa;z-index:6}
#storyBox b,#tutorial b{color:#ffd56a}
#storyBox .closeBtn,#tutorial .closeBtn{position:absolute;top:6px;right:8px;width:24px;height:24px;border-radius:50%;background:#9a2f1c;border:1px solid #ffd56a;color:#ffd56a;font:bold 14px Georgia,serif;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;padding:0}
#storyBox .closeBtn:hover,#tutorial .closeBtn:hover{background:#c0392b;color:#fff}
#waveInfo{position:absolute;top:70px;right:10px;background:rgba(20,8,0,.85);border:1px solid #7a5a1e;border-radius:4px;padding:6px 10px;font-size:11px;color:#d9c08a;display:none;max-width:220px}
#waveInfo.show{display:block}
.dontShowBtn{margin-top:8px;font:italic 11px Georgia,serif;color:#d9c08a;background:transparent;border:1px solid #7a5a1e;border-radius:3px;padding:3px 10px;cursor:pointer;transition:all .15s}
.dontShowBtn:hover{background:rgba(122,90,30,.3);color:#ffd56a}
#tutorial .dontShowBtn{color:#a8d4e8;border-color:#5fa3c0}
#tutorial .dontShowBtn:hover{background:rgba(95,163,192,.2);color:#fff}
#settingsBtn{position:absolute;bottom:8px;right:8px;z-index:10;width:32px;height:32px;border-radius:50%;background:#3b2610;border:2px solid #7a5a1e;color:#d9c08a;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
#settingsBtn:hover{background:#5a3a1a;color:#ffd56a;transform:rotate(30deg)}
#settingsPanel{position:absolute;bottom:46px;right:8px;z-index:10;background:rgba(20,8,0,.97);border:2px solid #b8892b;border-radius:6px;padding:12px 16px;display:none;min-width:260px;box-shadow:0 6px 24px rgba(0,0,0,.8)}
#settingsPanel.show{display:block}
#settingsPanel h3{margin:0 0 10px;color:#ffd56a;font-size:15px;border-bottom:1px solid #7a5a1e;padding-bottom:6px}
#settingsPanel label{display:flex;align-items:center;gap:8px;font-size:13px;margin:8px 0;cursor:pointer;color:#f1deae}
#settingsPanel label:hover{color:#ffd56a}
#settingsPanel input[type=checkbox]{width:16px;height:16px;accent-color:#b8892b;cursor:pointer}
#settingsPanel .resetBtn{margin-top:10px;width:100%;font:bold 12px Georgia,serif;color:#f1deae;background:#6b4423;border:2px solid #b8892b;border-radius:3px;padding:6px 10px;cursor:pointer;transition:all .15s}
#settingsPanel .resetBtn:hover{background:#85572b}
</style></head><body>
<div id="game">
 <button id="settingsBtn" title="Configurações">⚙</button>
 <div id="settingsPanel">
  <h3>⚙ Configurações</h3>
  <label><input type="checkbox" id="chkStories"> Mostrar histórias das ondas</label>
  <label><input type="checkbox" id="chkTutorials"> Mostrar tutoriais das torres</label>
  <button class="resetBtn" id="resetAll">🔄 Resetar todas as preferências</button>
 </div>
 <div class="bar">
  <span class="stat">💰 <b id="hG"></b></span><span class="stat">🏰 <b id="hH"></b></span>
  <span class="stat">🌊 Onda <b id="hW"></b></span><span class="stat">⭐ Nível <b id="hL"></b></span>
  <span class="stat">🪝 Arpões <b id="hHarp">0</b></span>
  <span class="ttl">Crônicas do Arpão</span>
 </div>
 <canvas id="c" width="900" height="600"></canvas>
 <div class="bar" id="towerBar">
  <button class="b" id="bA">🏹 Arqueiro · 50</button>
  <button class="b" id="bC">🪨 Catapulta · 100</button>
  <button class="b ice" id="bI" style="display:none">❄️ Gelo · 120</button>
  <button class="b thunder" id="bT" style="display:none">⚡ Raios · 180</button>
  <button class="b fire" id="bF" style="display:none">🔥 Fogo · 200</button>
  <button class="b dark" id="bD" style="display:none">💀 Sombria · 280</button>
  <button class="b harp" id="bH" style="display:none">🪝 Arpão · 150</button>
  <button class="b" id="bS" disabled>Vender torre</button>
  <button class="b go" id="bW">Iniciar Onda 1</button>
 </div>
 <div class="bar">
  <span id="tip"></span>
 </div>
 <div id="ov"></div>
 <div id="storyBox"></div>
 <div id="tutorial"></div>
 <div id="waveInfo"></div>
</div>
<script>
'use strict';
/* ============ CONFIGURAÇÃO ============ */
const W=900,H=600,TAU=Math.PI*2,$=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');
const PATH=[[-30,90],[180,90],[180,290],[420,290],[420,130],[640,130],[640,430],[300,430],[300,540],[795,540]];
const SEG=[];let TOTAL=0;
for(let i=1;i<PATH.length;i++){const l=Math.hypot(PATH[i][0]-PATH[i-1][0],PATH[i][1]-PATH[i-1][1]);SEG.push(l);TOTAL+=l}
function pointAt(d){for(let i=0;i<SEG.length;i++){if(d<=SEG[i]||i==SEG.length-1){const t=Math.min(d/SEG[i],1),a=PATH[i],b=PATH[i+1];return[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t]}d-=SEG[i]}}
function distSeg(px,py,a,b){const dx=b[0]-a[0],dy=b[1]-a[1];let t=((px-a[0])*dx+(py-a[1])*dy)/(dx*dx+dy*dy);t=Math.max(0,Math.min(1,t));return Math.hypot(px-a[0]-t*dx,py-a[1]-t*dy)}
const distPath=(x,y)=>Math.min(...SEG.map((_,i)=>distSeg(x,y,PATH[i],PATH[i+1])));

/* ============ PREFERÊNCIAS PERSISTENTES ============ */
const PREFS_KEY='cronicas_arpao_prefs';
function loadPrefs(){
 try{
  const saved=localStorage.getItem(PREFS_KEY);
  if(saved)return JSON.parse(saved);
 }catch(e){}
 return {showStories:true,showTutorials:true,seenStory:{},seenTutorial:{}};
}
function savePrefs(){
 try{localStorage.setItem(PREFS_KEY,JSON.stringify(PREFS))}catch(e){}
}
let PREFS=loadPrefs();
if(!PREFS.seenStory)PREFS.seenStory={};
if(!PREFS.seenTutorial)PREFS.seenTutorial={};

/* ============ TORRES — IDENTIDADE ÚNICA ============ */
const TT={
 arc:{name:'Arqueiro',cost:50,range:135,dmg:11,cd:.4,desc:'Dano rápido e barato. Bom contra inimigos isolados.',role:'single',unlock:1},
 cat:{name:'Catapulta',cost:100,range:110,dmg:38,cd:2.0,splash:58,desc:'Dano em ÁREA. Devastadora contra grupos densos.',role:'splash',unlock:1},
 ice:{name:'Gelo',cost:120,range:115,dmg:5,cd:.9,slow:.45,slowDur:1.8,splash:45,desc:'LENTIDÃO em área. Essencial contra inimigos rápidos.',role:'control',unlock:3},
 thunder:{name:'Raios',cost:180,range:145,dmg:26,cd:1.3,chain:4,desc:'CADEIA elétrica — atinge até 4 inimigos em sequência.',role:'chain',unlock:5},
 fire:{name:'Fogo',cost:200,range:125,dmg:12,cd:1.1,burn:14,burnDur:3,desc:'QUEIMADURA contínua. Ignora armadura, ótimo vs tanques.',role:'dot',unlock:7},
 dark:{name:'Sombria',cost:280,range:185,dmg:85,cd:2.2,desc:'Dano MASSIVO à distância. Elimina alvos prioritários.',role:'sniper',unlock:9}
};

/* ============ INIMIGOS — COMPORTAMENTOS ============ */
const ET={
 goblin:{hp:28,sp:72,gold:10,r:9,dmg:1,c:'#58b03a',behavior:'normal',desc:'Fraco e rápido'},
 orc:{hp:95,sp:46,gold:20,r:12,dmg:2,c:'#7d8f6a',behavior:'tank',desc:'Lento, resistente'},
 elite:{hp:220,sp:34,gold:40,r:14,dmg:4,c:'#7a1c1c',behavior:'armored',desc:'Blindado — reduz dano físico'},
 runner:{hp:45,sp:110,gold:18,r:8,dmg:2,c:'#c4a020',behavior:'fast',desc:'MUITO rápido!'},
 shaman:{hp:130,sp:38,gold:35,r:11,dmg:3,c:'#7a3a8a',behavior:'healer',desc:'Cura aliados próximos'},
 golem:{hp:260,sp:30,gold:45,r:15,dmg:4,c:'#8a8d96',behavior:'golem',desc:'Golem — IMUNE à Catapulta'},
 boss:{hp:240*15,sp:24,gold:300,r:28,dmg:20,c:'#5d7348',behavior:'boss',desc:'CHEFE — imune a lentidão'},
 dragon:{hp:240*30,sp:20,gold:800,r:34,dmg:50,c:'#8b1a1a',behavior:'dragon',desc:'DRAGÃO — requer 2 arpões'}
};

const WAVES=[
 {goblin:6},
 {goblin:8,orc:2},
 {goblin:6,orc:5,elite:1},
 {orc:4,elite:4,runner:3},
 {boss:1,orc:5,elite:3},
 {goblin:15,orc:8,elite:4,runner:5,golem:2},
 {orc:10,elite:6,shaman:2,golem:3},
 {goblin:20,orc:12,elite:6,runner:8,golem:4},
 {elite:10,orc:10,shaman:3,golem:5},
 {dragon:1,orc:8,elite:6,golem:4}
];
function waveDef(n){if(n<=10)return WAVES[n-1];const d={goblin:4+n,orc:2+n,elite:n-3,runner:Math.floor(n/2),golem:Math.floor(n/2)};if(n%5==0)d.boss=Math.floor(n/5);if(n%7==0)d.shaman=2;return d}

/* ============ NARRATIVA ============ */
const STORY={
 1:{title:'O Início da Invasão',text:'Os goblins despertaram nas florestas ao norte. O Rei Aldric convoca os defensores do reino. <b>Construa torres de Arqueiro ao longo do caminho</b> — elas são rápidas e baratas, ideais para os primeiros invasores.'},
 2:{title:'A Horda Cresce',text:'Orcs selvagens se juntam aos goblins. São mais resistentes. <b>Dica:</b> a <b>Catapulta</b> causa dano em área — perfeita quando os inimigos se agrupam nas curvas do caminho.'},
 3:{title:'O Gelo Ancestral',text:'Os magos do gelo despertam! <b>Nova torre: Gelo</b> — ela <b>retarda</b> os inimigos em área, dando tempo para suas outras torres atacarem. Dano baixo, mas controle valioso.'},
 4:{title:'Corredores Sombrios',text:'Batedores rápidos foram avistados! Eles <b>correm muito mais rápido</b> que os outros. Torres de gelo são cruciais agora — sem elas, eles passam direto.'},
 5:{title:'O PRIMEIRO CHEFE',text:'Um Chefe Orc lidera a horda! Ele é <b>imune à lentidão</b> e tem HP enorme. <b>Compre o ARPÃO (150 ouro)</b> — mire, segure 1.5s e clique para eliminar instantaneamente!<br><br>🗿 <b>ATENÇÃO:</b> na próxima onda surgem os <b>Golens de Pedra</b> — <b>totalmente imunes à Catapulta</b>! Prepare Arqueiros, Raios, Fogo, Sombria ou o Arpão contra eles.'},
 6:{title:'A Horda Infinita',text:'O reino resistiu, mas mais inimigos vêm. <b>Dica:</b> use o <b>Arpão</b> também em inimigos comuns se estiverem prestes a invadir o castelo — ele mata qualquer um!'},
 7:{title:'Xamãs Sombrios',text:'<b>Xamãs</b> apareceram! Eles <b>curam outros inimigos</b> próximos. Elimine-os primeiro com a torre <b>Sombria</b> (quando desbloqueada) ou com o Arpão.'},
 8:{title:'A Maré de Ferro',text:'As hordas não param. <b>Nova torre: Fogo</b> — a <b>queimadura</b> causa dano contínuo que <b>ignora armadura</b>. Ideal contra elites blindados.'},
 9:{title:'Sombras do Abismo',text:'O Rei sombrio enviou sua guarda de elite. <b>Nova torre: Sombria</b> — dano <b>massivo</b> e alcance enorme. Use-a para eliminar alvos prioritários antes que cheguem perto.'},
 10:{title:'O DRAGÃO ANCESTRAL',text:'O Dragão desperta! Ele tem <b>HP colossal</b> e é <b>imune à lentidão</b>. <b>Você precisará de DOIS arpões</b> — o primeiro causa 50% de dano, o segundo o elimina. Prepare-se!'}
};

/* ============ ESTADO ============ */
let G={state:'menu'};
const circ=(x,y,r,c)=>{ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill()};
function newGame(){
 G={state:'idle',gold:220,castle:{hp:25,max:25},wave:0,level:1,enemies:[],towers:[],projs:[],parts:[],rings:[],texts:[],
  queue:[],spT:0,sel:null,placing:null,mouse:{x:-99,y:-99},banner:null,shake:0,paused:false,time:0,
  harpoons:0,aiming:false,chargeStart:0,charging:false,harpoonProj:null,
  tutorialShown:{},storyShown:{},waveInfoShown:false,
  unlocked:{arc:true,cat:true,ice:false,thunder:false,fire:false,dark:false}};
 $('ov').className='hide';$('bW').disabled=false;$('bW').textContent='Iniciar Onda 1';
 $('storyBox').className='';$('tutorial').className='';$('waveInfo').className='';
 updateTowerBar();
}
function burst(x,y,c,n){for(let i=0;i<n;i++){const a=Math.random()*TAU,s=30+Math.random()*130;G.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:0,L:.5+Math.random()*.4,c,s:2+Math.random()*3})}}
const say=(s,t=2.6)=>G.banner={s,t};

/* ============ HISTÓRIA E TUTORIAL (persistentes até fechar) ============ */
function showStory(wave){
 if(!PREFS.showStories)return;
 const s=STORY[wave];if(!s)return;
 if(PREFS.seenStory[wave])return;
 const box=$('storyBox');
 box.innerHTML='<button class="closeBtn" title="Fechar">✕</button><b>📜 '+s.title+'</b><br>'+s.text+
  '<br><button class="dontShowBtn" onclick="dontShowStory('+wave+')">✓ Não mostrar esta história novamente</button>';
 box.className='show';
 box.querySelector('.closeBtn').onclick=()=>box.className='';
}
function dontShowStory(wave){
 PREFS.seenStory[wave]=true;
 savePrefs();
 $('storyBox').className='';
 say('História da onda '+wave+' ocultada',1.5);
}
function showTutorial(msg,key){
 if(!PREFS.showTutorials)return;
 if(key&&PREFS.seenTutorial[key])return;
 const t=$('tutorial');
 let html='<button class="closeBtn" title="Fechar">✕</button>'+msg;
 if(key)html+='<br><button class="dontShowBtn" onclick="dontShowTutorial(\''+key+'\')">✓ Não mostrar este tutorial novamente</button>';
 t.innerHTML=html;
 t.className='show';
 t.querySelector('.closeBtn').onclick=()=>t.className='';
}
function dontShowTutorial(key){
 PREFS.seenTutorial[key]=true;
 savePrefs();
 $('tutorial').className='';
 say('Tutorial ocultado',1.5);

class Projectile{
 constructor(tw,tg){this.x=tw.x;this.y=tw.y-8;this.tg=tg;this.dmg=tw.dmg;this.splash=tw.S.splash||0;this.sp=520;this.ang=0;this.dead=false;
  this.towerType=tw.t;this.slow=tw.S.slow||0;this.slowDur=tw.S.slowDur||0;
  this.chain=tw.S.chain||0;this.burn=tw.S.burn||0;this.burnDur=tw.S.burnDur||0;
  if(this.splash){this.sx=tw.x;this.sy=tw.y;this.T=Math.max(.6,Math.hypot(tg.x-tw.x,tg.y-tw.y)/200);this.k=0;this.h=0;
   const p=pointAt(Math.min(TOTAL,tg.d+tg.speed*this.T));this.tx=p[0];this.ty=p[1]}
  else{this.tx=tg.x;this.ty=tg.y}}
 update(dt){
  if(this.splash){
   this.k+=dt/this.T;const k=Math.min(1,this.k);
   this.x=this.sx+(this.tx-this.sx)*k;this.y=this.sy+(this.ty-this.sy)*k;this.h=Math.sin(Math.PI*k)*55;
   if(this.k>=1){this.dead=true;G.rings.push({x:this.tx,y:this.ty,r:this.splash,t:0});burst(this.tx,this.ty,'#8a8d93',10);burst(this.tx,this.ty,'#8a5a2b',6);
    for(const e of G.enemies)if(e.alive&&!(this.towerType=='cat'&&e.behavior=='golem')&&Math.hypot(e.x-this.tx,e.y-this.ty)<=this.splash+e.r*.5){
     dealDamage(e,this.dmg);
     if(this.slow&&e.behavior!='boss'&&e.behavior!='dragon')e.slowT=Math.max(e.slowT,this.slowDur);
    }}
   return}
  if(this.tg.alive){this.tx=this.tg.x;this.ty=this.tg.y}
  const dx=this.tx-this.x,dy=this.ty-this.y,d=Math.hypot(dx,dy),st=this.sp*dt;this.ang=Math.atan2(dy,dx);
  if(d<=st+3){this.dead=true;
   dealDamage(this.tg,this.dmg);
   if(this.slow&&this.tg.behavior!='boss'&&this.tg.behavior!='dragon'){this.tg.slowT=Math.max(this.tg.slowT,this.slowDur)}
   if(this.burn){this.tg.burnT=Math.max(this.tg.burnT,this.burnDur);this.tg.burnDmg=this.burn}
   if(this.chain>0){
    let cx=this.tg.x,cy=this.tg.y,last=this.tg,count=0;
    while(count<this.chain-1){
     let nearest=null,nd=95;
     for(const e of G.enemies){if(!e.alive||e===last)continue;const dd=Math.hypot(e.x-cx,e.y-cy);if(dd<nd){nd=dd;nearest=e}}
     if(!nearest)break;
     dealDamage(nearest,this.dmg*.6);
     cx=nearest.x;cy=nearest.y;last=nearest;count++;
     G.parts.push({x:cx,y:cy,vx:0,vy:0,t:0,L:.2,c:'#ffd040',s:4});
    }
   }
  }else{this.x+=dx/d*st;this.y+=dy/d*st}}
 draw(){const g=ctx;
  if(this.splash){g.fillStyle='rgba(0,0,0,.3)';g.beginPath();g.ellipse(this.x,this.y,5,2.5,0,0,TAU);g.fill();
   circ(this.x,this.y-this.h-8,5,'#7d8087');circ(this.x-1.5,this.y-this.h-9.5,2,'#a9acb2');return}
  g.save();g.translate(this.x,this.y);g.rotate(this.ang);
  if(this.towerType=='ice'){g.strokeStyle='#7ec8e3';g.lineWidth=2;g.beginPath();g.moveTo(-8,0);g.lineTo(6,0);g.stroke();g.fillStyle='#aef';g.beginPath();g.arc(7,0,3,0,TAU);g.fill()}
  else if(this.towerType=='thunder'){g.strokeStyle='#ffd040';g.lineWidth=2;g.beginPath();g.moveTo(-8,-2);g.lineTo(-2,2);g.lineTo(2,-2);g.lineTo(8,2);g.stroke()}
  else if(this.towerType=='fire'){g.fillStyle='#ff6a20';g.beginPath();g.arc(0,0,4,0,TAU);g.fill();g.fillStyle='#ffd040';g.beginPath();g.arc(0,0,2,0,TAU);g.fill()}
  else if(this.towerType=='dark'){g.fillStyle='#a060d0';g.beginPath();g.arc(0,0,5,0,TAU);g.fill();g.strokeStyle='#fff';g.lineWidth=1;g.beginPath();g.arc(0,0,5,0,TAU);g.stroke()}
  else{g.strokeStyle='#d8c08a';g.lineWidth=1.6;g.beginPath();g.moveTo(-8,0);g.lineTo(6,0);g.stroke();g.fillStyle='#ccc';g.beginPath();g.moveTo(6,-2);g.lineTo(10,0);g.lineTo(6,2);g.fill()}
  g.restore()}}

class Tower{
 constructor(t,x,y){this.t=t;this.x=x;this.y=y;this.cd=0;this.rec=0;this.ang=-Math.PI/2}
 get S(){return TT[this.t]}
 get lvl(){return this.t=='cat'?G.level:1}
 get units(){return this.t=='cat'?Math.min(G.level,4):1}
 get dmg(){return this.S.dmg*(1+.2*(this.lvl-1))}
 get range(){return this.S.range+Math.min(this.lvl-1,5)*8}
 update(dt){
  this.cd-=dt;this.rec=Math.max(0,this.rec-dt*3);let best=null;
  for(const e of G.enemies)if(e.alive&&Math.hypot(e.x-this.x,e.y-this.y)<=this.range+e.r&&!(this.t=='cat'&&e.behavior=='golem')&&(!best||e.d>best.d))best=e;
  if(best){this.ang=Math.atan2(best.y-this.y,best.x-this.x);

/* ============ HUD ============ */
function hud(){

 $('hG').textContent=G.gold;$('hH').textContent=G.castle.hp+'/'+G.castle.max;$('hW').textContent=Math.max(1,G.wave);$('hL').textContent=G.level;
 $('hHarp').textContent=G.harpoons;
 $('bA').classList.toggle('no',G.gold<50);$('bC').classList.toggle('no',G.gold<100);
 $('bI').classList.toggle('no',G.gold<120);$('bT').classList.toggle('no',G.gold<180);
 $('bF').classList.toggle('no',G.gold<200);$('bD').classList.toggle('no',G.gold<280);
 $('bH').classList.toggle('no',G.gold<150);
 $('bA').classList.toggle('on',G.placing=='arc');$('bC').classList.toggle('on',G.placing=='cat');
 $('bI').classList.toggle('on',G.placing=='ice');$('bT').classList.toggle('on',G.placing=='thunder');
 $('bF').classList.toggle('on',G.placing=='fire');$('bD').classList.toggle('on',G.placing=='dark');
 $('bH').classList.toggle('on',G.aiming);
 $('bS').disabled=!G.sel;$('bS').textContent=G.sel?'Vender (+'+Math.floor(G.sel.S.cost/2)+')':'Vender torre';
 let tip='';
 if(G.aiming)tip='Mire e clique · segure 1.5s para carregar e solte para lançar';
 else if(G.placing)tip=TT[G.placing].name+' — '+TT[G.placing].desc+' · botão direito cancela';
 else if(G.sel)tip=G.sel.S.name+' · dano '+Math.round(G.sel.dmg)+' · alcance '+Math.round(G.sel.range)+' · '+G.sel.S.desc;
 else tip='P = pausar · ESC = cancelar';
 $('tip').textContent=tip;
}

/* ============ ENTRADA ============ */
function pick(t){
 if(G.state!='idle'&&G.state!='wave')return;
 G.sel=null;G.aiming=false;
 if(G.placing==t){G.placing=null;return}
 G.placing=t;
 const tt=TT[t];
 showTutorial('<b>'+tt.name+'</b> — '+tt.desc+'<br>Custo: '+tt.cost+' · Dano: '+tt.dmg+(tt.cd?' · Recarga: '+tt.cd+'s':'')+(tt.range?' · Alcance: '+tt.range:'')+(tt.splash?' · Área: '+tt.splash:'')+(tt.chain?' · Cadeia: '+tt.chain:'')+(tt.burn?' · Queimadura: '+tt.burn+'/s por '+tt.burnDur+'s':''),'tower_'+t);
}
$('bA').onclick=()=>pick('arc');$('bC').onclick=()=>pick('cat');$('bW').onclick=startWave;
$('bI').onclick=()=>pick('ice');$('bT').onclick=()=>pick('thunder');$('bF').onclick=()=>pick('fire');$('bD').onclick=()=>pick('dark');
$('bH').onclick=()=>{if(G.state!='idle'&&G.state!='wave')return;if(G.harpoons>0){startAiming()}else{buyHarpoon();if(G.harpoons>0)startAiming()}};
$('bS').onclick=()=>{if(!G.sel)return;G.gold+=Math.floor(G.sel.S.cost/2);burst(G.sel.x,G.sel.y,'#ffd24a',12);G.towers=G.towers.filter(t=>t!=G.sel);G.sel=null};
const mpos=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}};
cv.onmousemove=e=>{if(G.mouse)G.mouse=mpos(e)};
cv.onmousedown=e=>{
 if(G.aiming){beginCharge();return}
 if(G.state!='idle'&&G.state!='wave')return;const m=mpos(e);
 if(G.placing){const c=TT[G.placing].cost;
  if(G.gold<c)return say('Ouro insuficiente!',1.2);
  if(!validSpot(m.x,m.y))return say('Local inválido!',1.2);
  G.gold-=c;G.towers.push(new Tower(G.placing,m.x,m.y));if(!e.shiftKey)G.placing=null;return}
 G.sel=G.towers.find(t=>Math.hypot(t.x-m.x,t.y-m.y)<20)||null};
cv.onmouseup=e=>{if(G.aiming){releaseHarpoon()}};
cv.oncontextmenu=e=>{e.preventDefault();G.placing=null;G.sel=null;G.aiming=false;G.charging=false};
addEventListener('keydown',e=>{if(e.key=='Escape'){G.placing=null;G.sel=null;G.aiming=false;G.charging=false}if((e.key=='p'||e.key=='P')&&(G.state=='idle'||G.state=='wave'))G.paused=!G.paused});

let last=0;
function loop(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;if(G.state!='menu'&&!G.paused)update(dt);draw();hud();requestAnimationFrame(loop)}

  g.fillStyle='#1a1226';g.beginPath();g.moveTo(x0+68,base);g.lineTo(x0+68,386);g.arc(x0+85,386,17,Math.PI,0);g.lineTo(x0+102,base);g.fill();

 function harpoonStreak(){
